<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
<title id="title">Two Canadian dollars</title><desc id="desc">$2, two dollars, the value of a toonie, represented by a circular value diagram. Original Stepstone value diagram.</desc>
<g font-family="sans-serif" text-anchor="middle"><circle cx="50" cy="50" r="46" fill="#e0e6e8" stroke="#39434b" stroke-width="4"/><circle cx="50" cy="50" r="34" fill="#f4d68a" stroke="#655024" stroke-width="2"/><text x="50" y="28" font-size="13" fill="#35280f">CAD</text><text x="50" y="62" font-size="34" font-weight="700" fill="#35280f">$2</text><text x="50" y="82" font-size="12" fill="#35280f">toonie</text></g></svg>
