<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
<title id="title">Twenty-five Canadian cents</title><desc id="desc">25 cents, one quarter of a dollar, represented by a circular value diagram. Original Stepstone value diagram.</desc>
<g font-family="sans-serif" text-anchor="middle"><circle cx="50" cy="50" r="46" fill="#e0e6e8" stroke="#39434b" stroke-width="4"/><circle cx="50" cy="50" r="39" fill="none" stroke="#39434b" stroke-width="1.5"/><text x="50" y="28" font-size="13" fill="#263138">CAD</text><text x="50" y="62" font-size="32" font-weight="700" fill="#263138">25¢</text><text x="50" y="82" font-size="12" fill="#263138">quarter</text></g></svg>
