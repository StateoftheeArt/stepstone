<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
<title id="title">One Canadian dollar</title><desc id="desc">$1, one dollar, the value of a loonie, represented by a circular value diagram. Original Stepstone value diagram.</desc>
<g font-family="sans-serif" text-anchor="middle"><circle cx="50" cy="50" r="46" fill="#f4d68a" stroke="#655024" stroke-width="4"/><circle cx="50" cy="50" r="39" fill="none" stroke="#655024" stroke-width="1.5"/><text x="50" y="28" font-size="13" fill="#35280f">CAD</text><text x="50" y="62" font-size="35" font-weight="700" fill="#35280f">$1</text><text x="50" y="82" font-size="12" fill="#35280f">loonie</text></g></svg>
